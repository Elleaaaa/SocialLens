# fly.toml app configuration file generated for sociallens on 2026-07-21T09:05:09Z
#

app = 'sociallens'
primary_region = 'sin'

[build]

[mounts]
  source = "sociallens_data"
  destination = "/data"

[env]
  BROWSER_HEADLESS = "true"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1